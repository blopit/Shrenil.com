  webtoon-ip: "Brokered AXED IP rights deal with Wattpad WEBTOON Studios — book + 2-season animated TV adaptation (2025) — multi-party, multi-year commercial agreement negotiated and closed independently."
  coursera-download: "Partnered with product and engineering at Coursera to ship iOS course-download, driving 20%+ completion lift across a 24M+ learner base — quantified business case, technical scoping, cross-functional delivery."
