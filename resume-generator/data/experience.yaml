# All work history bullets, tagged with keywords (for ATS coverage) and
# affinities (which job slugs find them most relevant — used by `resume tailor`).
#
# Bullet ids are stable: per-job configs reference them by id.
#
# 2026 formula per bullet:  <strong action verb> <tool/method> <quantified result> <scope>
# Hard rules enforced by verify.bullet_lints:
#   - ≤30 words (fail at 32+)
#   - ≥1 digit (fail at 0)
#   - first non-stopword token = strong verb (warn only)
# Placeholders <<METRIC: …>> are tolerated in YAML but the build will refuse
# to compile any PDF containing them — fill them in before shipping.

