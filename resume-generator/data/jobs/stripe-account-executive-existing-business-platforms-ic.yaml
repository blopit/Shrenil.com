slug: stripe-account-executive-existing-business-platforms-ic
company: Stripe
role: Account Executive, Existing Business Platforms (IC)
headline: "API-Platform Founder · Trusted Advisor for Existing-Account Expansion"
summary: >
  Founder of an API-first AI orchestration platform with a track record of expanding
  existing accounts through technical product depth and commercial framing. Drove
  $5M+ apparel pre-order GMV at Faire across three international markets — owned
  cross-functional rollout from product strategy through finance, partnering with
  product, engineering, and operations stakeholders. Brokered AXED's IP rights deal
  with Wattpad WEBTOON Studios for a book + 2-season animated television adaptation
  releasing 2025. Now runs founder-led conversations and product workshops for
  CentrOS, deployed in production with finance, operations, and engineering
  stakeholders. Strongest where existing-customer expansion at the C-level is
  unlocked by translating API and platform integrations into revenue and retention
  outcomes for enterprise technical buyers.
