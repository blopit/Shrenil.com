[project]
name = "resume-generator"
version = "0.1.0"
description = "Internal tool: tailored 1-page resume PDFs per target job posting"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "anthropic>=0.40",
    "rich>=13.7",
]

[project.scripts]
resume = "resume_generator.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_generator"]
