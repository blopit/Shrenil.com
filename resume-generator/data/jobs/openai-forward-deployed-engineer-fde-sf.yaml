bullet_overrides:
  centros-platform: "Built CentrOS production LLM multi-agent runtime end-to-end: typed tool contracts, eval gates, LangFuse traces, HITL approval interrupts — collapsed 4 vendor primitives into 1 governed layer."
  centros-eval: "Built eval-driven harness + LangFuse trace pipeline: golden datasets, task-level scorers, regression suites, prompt versioning, failure taxonomy — caught 22+ silent generative-model regressions before production release."
  centros-dogfood: "Deployed CentrOS end-to-end at a 23-unit hospitality customer (guest comms, refunds, vendor invoices, compliance): full-stack Python + TypeScript, 3,980+ Vitest tests, CI-backed live ops since Feb 2026."
  cc-fastapi: "Prototyped customer accommodations workflows on CentrOS: 3-stage guest-triage pipeline (classify → plan → draft) in Python/FastAPI with HITL approval gates before any irreversible action."
