bullet_overrides:
  centros-platform: "Founded CentrOS from zero: built new product category, defined GTM narrative, closed first paying design-partner customers — sole operator on strategy, sales cycle, and roadmap across a 10+ month go-to-market motion."
  centros-hitl: "Designed capital-grade approval workflows: confidence-gated handoff, human sign-off before irreversible financial actions, audit trails, escalation policy — 100% of high-risk transactions reviewed, matching lending-industry compliance patterns."
  centros-dogfood: "Deployed CentrOS at a 23-unit operation handling guest comms, refunds, and vendor invoices — 3,980+ tests passing on main, live in production since Feb 2026 with direct P&L accountability and executive-level customer relationships."
  ind-axed: "Closed multi-year, multi-format IP rights deal with Wattpad WEBTOON Studios (book + 2-season animated TV, releasing 2025) — structured, negotiated, and closed solo end-to-end as sole commercial principal."
  faire-apparel: "Owned apparel pre-order initiative at Faire: drove $5M+ GMV across 3+ international markets over 6-month cycle — partnered cross-functionally with Product, Merch, and Ops to design a repeatable new-market playbook."
  webtoon-ip: "Built and closed multi-year commercial agreement with Wattpad WEBTOON Studios covering book + 2-season animated TV adaptation (2025) — sole negotiator across a 12+ month enterprise-style deal cycle from cold outreach to signed contract."
  webtoon-workflow: "Designed operator workflow (queue → tooling → review → ship) serving 2M+ monthly views on a WEBTOON Original — same GTM playbook approach now applied to selling new agent-automation motions to enterprise buyers."
  coursera-download: "Shipped iOS course-download feature in 4 months, lifting course completion 20%+ across Coursera's 24M+ learner base — direct product impact measured against a top company priority."
