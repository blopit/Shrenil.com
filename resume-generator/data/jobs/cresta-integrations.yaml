    Senior Backend Engineer for AI Agent Integrations is a precise match
    for the CentrOS tool registry + handoff layer I've been building.
    Idempotent retries, audit logs, scoped OAuth, session continuity —
    that's the exact contract set I'd otherwise reinvent here.
  cover_letter:
    tone: "backend-engineer, integrations-first, pragmatic"
    paragraphs: 3
    must_mention: [integrations, context propagation, AI-to-human handoff, audit logs, CentrOS]
    drafted: false
    body: null
  custom_questions:
    - q: "Describe your experience with AI-to-human handoff in production."
      a: >
        At CentrOS I designed handoff with 100% context preservation:
        shared state contract, full event history, durable IDs, operator-
        readable summaries, ownership transitions surviving interruption.
        0 lost context across escalation events in live ops on the 23-unit
        motel vertical. That's exactly the seam contact-center AI either
        earns operator trust on or burns it.
