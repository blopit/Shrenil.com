    vertical; the patterns generalize.
  why_role: >
    AI Architect for agentic apps means translating ambiguous business
    processes into cloud-native AI systems that actually ship into
    regulated environments. That's the work, not the demo — and the
    work is what I want.
  cover_letter:
    tone: "senior, regulated-environment-fluent, candid"
    paragraphs: 3
    must_mention: [LangGraph, MCP, RAG, governance, regulated, CentrOS]
    drafted: false
    body: null
  custom_questions:
    - q: "What's your experience translating messy enterprise workflows into agentic systems?"
      a: >
        At CentrOS I mapped a 23-unit motel + 20-unit residential ops
        vertical from email/SMS/Slack/PDF chaos into 12+ typed agent
        workflows with HITL boundaries — guest comms, refunds, vendor
        invoices, compliance. 3,980+ Vitest tests on main covering live
        ops; 0 silent run loss across 6 months. Same patterns generalize
        directly to enterprise + government workflows.
      char_limit: 800
