bullet_overrides:
  centros-platform: "Built CentrOS production AI agent platform: owned technical vision, product roadmap, and live deployment. Consolidated 4 vendor primitives into 1 governed commercial layer."
  centros-tools: "Built MCP-style tool registry with scoped OAuth permissions, JSON-schema validation, retry policy, audit logging — turned ad-hoc API calls into 100% governed typed agent tool invocations for enterprise integrations."
  centros-platform-leverage: "Shipped 5+ reusable platform primitives (connectors, secrets, approval gates, eval hooks, deploy templates) — cut new-integration setup from weeks to 2 days while preserving security and compliance standards."
  faire-apparel: "Owned apparel pre-order revenue at Faire: $5M+ GMV across 3+ international markets over 6-month staged workstreams — full cross-functional execution with product, ops, finance, and merchant stakeholders."
