slug: stripe-account-executive-product-sales-capital
company: Stripe
role: "Product Account Executive, Capital"
headline: "Builder-Mindset Technical Operator · Product & GTM"
summary: >
  Engineer-operator with a builder's mindset who has personally closed and shipped
  high-stakes commercial deals (multi-year IP rights with Wattpad WEBTOON Studios,
  $5M+ GMV apparel initiatives at Faire) while designing net-new product motions
  from the ground up. Deep technical fluency in payments-adjacent workflow
  automation, capital/lending-style approval systems, and consultative solutioning
  — comfortable serving as SME to executives and translating customer needs into
  product roadmap feedback in high-growth, ambiguous environments.
