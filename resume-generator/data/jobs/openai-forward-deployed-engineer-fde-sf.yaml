      - "HITL approvals, prompt versioning, hybrid RAG (pgvector, OpenSearch)"
  - title: "Full-Stack Engineering"
    items:
      - "Python · FastAPI · TypeScript · JavaScript · React · Node · Hono"
      - "PostgreSQL · Drizzle · Vitest · CI/CD · production incident response"
  - title: "Forward-Deployed Delivery"
    items:
