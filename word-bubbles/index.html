<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Word Bubbles Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A daily word puzzle: swipe through scrambled letter bubbles to spell the hidden words.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one fixed phone-height column. Goal (theme + word slots) on top, the word being spelled floating in the middle,
   a bubble field that is laid out to the exact space left, and a thin scorecard at the bottom. Nothing scrolls. */
:root {
  --bg: #edf3fb;
  --blob1: rgba(255, 170, 214, 0.55);
  --blob2: rgba(160, 208, 255, 0.65);
  --blob3: rgba(178, 255, 226, 0.55);
  --fg: #172033;
  --muted: #5d6c88;
  --glass: rgba(255, 255, 255, 0.52);
  --glass-strong: rgba(255, 255, 255, 0.74);
  --glass-border: rgba(255, 255, 255, 0.85);
  --glass-shadow: 0 12px 32px rgba(32, 48, 90, 0.12);
  --bubble-hi: rgba(255, 255, 255, 0.98);
  --bubble-mid: rgba(255, 255, 255, 0.72);
  --bubble-lo: rgba(190, 214, 255, 0.6);
  --bubble-border: rgba(255, 255, 255, 0.95);
  --bubble-shadow: 0 10px 22px rgba(30, 45, 90, 0.14), inset 0 -8px 14px rgba(110, 150, 220, 0.18), inset 0 2px 3px rgba(255, 255, 255, 0.95);
  --accent: #0e86b3;
  --accent-2: #2c6fe3;
  --accent-soft: rgba(14, 134, 179, 0.16);
  --accent-glow: rgba(14, 134, 179, 0.35);
  --on-accent: #ffffff;
  --good: #1f9e67;
  --bad: #e04e52;
  --bad-soft: rgba(224, 78, 82, 0.16);
  --hint: #e5a11c;
  --gold-1: #f6c95a;
  --gold-2: #e3a21f;
  --on-gold: #2b1d00;
  --slot-border: rgba(23, 32, 51, 0.24);
  --slot-bg: rgba(23, 32, 51, 0.06);
  --dim: rgba(10, 16, 30, 0.35);
  --font-display: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", sans-serif;
  --r-xl: 26px; --r-l: 18px; --r-m: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120;
    --blob1: rgba(214, 72, 160, 0.28);
    --blob2: rgba(46, 118, 230, 0.32);
    --blob3: rgba(32, 190, 150, 0.22);
    --fg: #e6edf7;
    --muted: #93a2bd;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-strong: rgba(255, 255, 255, 0.11);
    --glass-border: rgba(255, 255, 255, 0.16);
    --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    --bubble-hi: rgba(255, 255, 255, 0.42);
    --bubble-mid: rgba(255, 255, 255, 0.12);
    --bubble-lo: rgba(120, 160, 255, 0.14);
    --bubble-border: rgba(255, 255, 255, 0.28);
    --bubble-shadow: 0 10px 22px rgba(0, 0, 0, 0.35), inset 0 -8px 14px rgba(60, 100, 200, 0.16), inset 0 2px 3px rgba(255, 255, 255, 0.35);
    --accent: #38b6e0;
    --accent-2: #5b8cf2;
    --accent-soft: rgba(56, 182, 224, 0.2);
    --accent-glow: rgba(56, 182, 224, 0.4);
    --on-accent: #06111f;
    --good: #3ccf8c;
    --bad: #ff6b6e;
    --bad-soft: rgba(255, 107, 110, 0.2);
    --hint: #f3b73a;
  --gold-1: #f3c45a;
  --gold-2: #d99a1c;
  --on-gold: #241800;
    --gold-1: #f3c45a;
    --gold-2: #d99a1c;
    --on-gold: #241800;
    --slot-border: rgba(230, 237, 247, 0.28);
    --slot-bg: rgba(230, 237, 247, 0.07);
    --dim: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120;
  --blob1: rgba(214, 72, 160, 0.28);
  --blob2: rgba(46, 118, 230, 0.32);
  --blob3: rgba(32, 190, 150, 0.22);
  --fg: #e6edf7;
  --muted: #93a2bd;
  --glass: rgba(255, 255, 255, 0.07);
  --glass-strong: rgba(255, 255, 255, 0.11);
  --glass-border: rgba(255, 255, 255, 0.16);
  --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  --bubble-hi: rgba(255, 255, 255, 0.42);
  --bubble-mid: rgba(255, 255, 255, 0.12);
  --bubble-lo: rgba(120, 160, 255, 0.14);
  --bubble-border: rgba(255, 255, 255, 0.28);
  --bubble-shadow: 0 10px 22px rgba(0, 0, 0, 0.35), inset 0 -8px 14px rgba(60, 100, 200, 0.16), inset 0 2px 3px rgba(255, 255, 255, 0.35);
  --accent: #38b6e0;
  --accent-2: #5b8cf2;
  --accent-soft: rgba(56, 182, 224, 0.2);
  --accent-glow: rgba(56, 182, 224, 0.4);
  --on-accent: #06111f;
  --good: #3ccf8c;
  --bad: #ff6b6e;
  --bad-soft: rgba(255, 107, 110, 0.2);
  --hint: #f3b73a;
  --slot-border: rgba(230, 237, 247, 0.28);
  --slot-bg: rgba(230, 237, 247, 0.07);
  --dim: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; overflow: hidden; }
body {
  height: 100%;
  margin: 0;
  padding-block: 8px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: manipulation;
  overflow: hidden;
}
.bg {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: var(--bg);
  background-image:
    radial-gradient(46% 36% at 10% 6%, var(--blob1), transparent 70%),
    radial-gradient(42% 34% at 92% 18%, var(--blob2), transparent 70%),
    radial-gradient(52% 40% at 50% 104%, var(--blob3), transparent 70%);
}
button { font-family: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; flex: none; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 32% 28%, var(--bubble-hi) 0%, var(--bubble-mid) 48%, var(--bubble-lo) 100%);
  border: 1px solid var(--bubble-border); box-shadow: var(--bubble-shadow);
}
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }
.brand .day { color: var(--muted); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.top-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--glass-border);
  background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: var(--fg); font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: var(--glass-shadow);
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.icon-btn svg { width: 17px; height: 17px; }

/* difficulty tabs */
.tabs {
  position: relative; display: flex; padding: 3px; border-radius: 999px; flex: none;
  background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--glass-shadow);
}
.tabs .thumb {
  position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 999px;
  background: var(--glass-strong); box-shadow: 0 2px 10px rgba(20, 30, 60, 0.12);
  transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.15);
}
.tab {
  position: relative; z-index: 1; flex: 1; border: 0; background: transparent; padding: 7px 0; border-radius: 999px;
  font-weight: 800; font-size: 13px; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px; transition: color 0.2s;
}
.tab.active { color: var(--fg); }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.tab[data-level="easy"] .dot { background: var(--good); }
.tab[data-level="medium"] .dot { background: var(--hint); }
.tab[data-level="hard"] .dot { background: var(--bad); }
.tab .check { font-size: 11px; color: var(--good); min-width: 10px; }

/* stage: the goal, tray, board and scorecard sit together in the middle of the screen */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }

.goal { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.eyebrow { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
.theme { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; }
.progress { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding-top: 2px; }
.slot {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 30px; padding: 0 11px; border-radius: 999px;
  border: 1.5px dashed var(--slot-border); color: var(--muted);
  font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.06em;
}
.slot i { width: 6px; height: 6px; border-radius: 50%; background: var(--slot-border); display: inline-block; }
.slot.hinted { border-style: solid; border-color: var(--hint); color: var(--fg); }
.slot.solved {
  border: 1.5px solid transparent; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: var(--on-accent);
  animation: pop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3) backwards;
}

/* the word tray: picked bubbles land here as tiles, left to right */
.preview { flex: none; display: flex; flex-direction: column; align-items: stretch; gap: 2px; }
.pill {
  position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; padding: 0 84px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); box-shadow: var(--glass-shadow);
}
.pill.shake { animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
.pill-prompt { color: var(--muted); font-size: 14px; font-weight: 800; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pill.is-empty { padding: 0 18px; }
.pill-word { display: flex; align-items: center; gap: 5px; }
.pill-word.locked { gap: 0; }
.chunk {
  height: 42px; min-width: 42px; padding: 0 11px; border-radius: 12px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 32% 28%, var(--bubble-hi) 0%, var(--bubble-mid) 48%, var(--bubble-lo) 100%);
  border: 1px solid var(--bubble-border); box-shadow: 0 4px 10px rgba(30, 45, 90, 0.12); color: var(--fg);
  font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: 0.02em; line-height: 1;
  transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), border-radius 0.25s, background 0.25s, color 0.25s, opacity 0.2s, box-shadow 0.25s;
}
.chunk.landing { opacity: 0; }
.pill-word.locked .chunk { background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: var(--on-accent); border-radius: 0; border-color: transparent; box-shadow: none; }
.pill-word.locked .chunk:first-child { border-radius: 999px 0 0 999px; padding-left: 14px; }
.pill-word.locked .chunk:last-child { border-radius: 0 999px 999px 0; padding-right: 14px; }
.pill-word.locked .chunk:only-child { border-radius: 999px; }
.pill .count { position: absolute; right: 50px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill .count.nomatch { color: var(--bad); }
.pill-btn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800;
  background: var(--slot-bg); color: var(--muted); transition: transform 0.15s;
}
.pill-btn:active { transform: translateY(-50%) scale(0.92); }
.msg { height: 18px; line-height: 18px; text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); }

/* a chunk in flight between the board and the tray, or a finished word dropping into its slot */
.fly {
  position: fixed; z-index: 30; pointer-events: none; display: flex; align-items: center; justify-content: center; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, var(--bubble-hi) 0%, var(--bubble-mid) 48%, var(--bubble-lo) 100%);
  border: 1px solid var(--bubble-border); box-shadow: var(--bubble-shadow); color: var(--fg);
  font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: 0.02em; line-height: 1; white-space: nowrap; overflow: hidden;
  transition: left 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), border-radius 0.32s, background-color 0.32s;
}
.fly.tile { border-radius: 11px; background: var(--accent-soft); border-color: transparent; box-shadow: none; }
.fly.word { border-radius: 999px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: var(--on-accent); border-color: transparent; box-shadow: 0 10px 24px var(--accent-glow); font-size: 15px; letter-spacing: 0.06em; }
.slot.arriving { opacity: 0; animation: none; }


/* day switcher */
.daynav { flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; }
.daynav-label { display: flex; align-items: baseline; gap: 6px; min-width: 170px; justify-content: center; font-variant-numeric: tabular-nums; }
.daynav-label b { font-weight: 800; font-size: 15px; }
.daynav .day { color: var(--muted); font-weight: 800; font-size: 13px; }
.nav-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--glass-border); background: var(--glass); color: var(--fg);
  font-size: 22px; font-weight: 700; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0 0 2px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: transform 0.15s, opacity 0.2s;
}
.nav-btn:active { transform: scale(0.92); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.daynav #todayBtn { position: absolute; right: 0; }
.stage.slide-left { animation: slideL 0.28s ease-out; }
.stage.slide-right { animation: slideR 0.28s ease-out; }
@keyframes slideL { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes slideR { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }

/* combo: clean words in a row warm the tray up */
.combo {
  position: absolute; left: 8px; top: 50%; transform: translateY(-50%); height: 30px; padding: 0 10px; border-radius: 999px;
  display: inline-flex; align-items: center; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums;
  background: var(--accent-soft); color: var(--accent); animation: pop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3);
}
.pill { transition: box-shadow 0.4s, border-color 0.4s; }
.pill[data-heat="1"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--glass-shadow); }
.pill[data-heat="2"] { border-color: var(--hint); box-shadow: 0 0 0 4px rgba(229, 161, 28, 0.22), 0 10px 30px rgba(229, 161, 28, 0.3); }
.pill[data-heat="2"] .combo { background: rgba(229, 161, 28, 0.2); color: var(--hint); }
.pill[data-heat="3"] { border-color: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft), 0 12px 34px rgba(224, 78, 82, 0.35); }
.pill[data-heat="3"] .combo { background: var(--bad-soft); color: var(--bad); }
.combo.bump { animation: bump 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
@keyframes bump { 0% { transform: translateY(-50%) scale(1); } 40% { transform: translateY(-50%) scale(1.35); } 100% { transform: translateY(-50%) scale(1); } }


/* chrome recedes while you spell and returns when the tray is empty (no layout change, so nothing moves) */
.top, .daynav, .tabs, .status, .progress { transition: opacity 0.35s ease, transform 0.35s ease, filter 0.35s ease; }
body.focus .top, body.focus .daynav, body.focus .tabs { opacity: 0.22; transform: scale(0.94); filter: blur(1.5px); }
body.focus .status, body.focus .progress { opacity: 0.4; }
@media (hover: hover) { body.focus .top:hover, body.focus .daynav:hover, body.focus .tabs:hover, body.focus .status:hover { opacity: 1; transform: none; filter: none; } }

/* rank meter (replaces par) */
.rank { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 110px; }
.rank-top { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.rank-top b { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--fg); }
.rank-top span { font-size: 13px; font-weight: 800; color: var(--muted); }
.rankbar { width: 100%; height: 5px; border-radius: 3px; background: var(--slot-bg); overflow: hidden; }
.rankbar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
.rank.bump { animation: bumpr 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
@keyframes bumpr { 40% { transform: scale(1.15); } }

/* bonus strip: what you've found, and how many are still makeable */
.bonusbar { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 420px; height: 32px; padding: 0 4px; font-size: 12px; font-weight: 800; color: var(--hint); }
.bonus-list { flex: 1; min-width: 0; display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.bonus-list::-webkit-scrollbar { display: none; }
/* bonus chips match the hidden-word slots, in gold */
.bchip {
  display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; flex: none;
  background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); color: var(--on-gold);
  font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.06em;
}
.bchip.new { animation: pop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.3) backwards; }
.bchip.arriving { opacity: 0; animation: none; }
.pill-word.locked.gold .chunk { background: linear-gradient(180deg, var(--gold-1), var(--gold-2)); color: var(--on-gold); }
.fly.word.gold { background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); color: var(--on-gold); box-shadow: 0 10px 24px rgba(229, 161, 28, 0.35); }
.bonus-empty { color: var(--muted); font-weight: 700; }
.bonus-left { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
.result .tip { color: var(--fg); font-size: 14px; }
.result .tip b { color: var(--hint); letter-spacing: 0.04em; }

/* bonus words */
.bonus-btn {
  position: absolute; right: 50px; top: 50%; transform: translateY(-50%); height: 30px; padding: 0 10px; border-radius: 999px; border: 0; cursor: pointer;
  background: rgba(229, 161, 28, 0.18); color: var(--hint); font-weight: 800; font-size: 13px; animation: pop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.3);
}
.chip-btn .meter { display: inline-flex; gap: 3px; margin-left: 2px; }
.chip-btn .meter i { width: 6px; height: 6px; border-radius: 50%; background: var(--slot-border); }
.chip-btn .meter i.on { background: var(--hint); }
.chip-btn .free { color: var(--good); }
.bonus-line { color: var(--hint) !important; font-size: 13px !important; }

/* a few bubbles rise when a board is finished */
.celebrate {
  position: fixed; z-index: 25; pointer-events: none; width: var(--s, 14px); height: var(--s, 14px); border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, var(--bubble-hi) 0%, var(--bubble-mid) 48%, var(--bubble-lo) 100%);
  border: 1px solid var(--bubble-border); box-shadow: var(--bubble-shadow);
  animation: risepop var(--t, 900ms) cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}
@keyframes risepop { 0% { transform: translate(0, 0) scale(0.4); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx, 0px), var(--dy, -120px)) scale(1.05); opacity: 0; } }

  function buildPuzzle(level, day, data) {

      }
      if (score === 3) break;
    }

  renderSoundBtn();
  // browsers only allow audio after a touch, so wake it on the first one
  document.addEventListener('pointerdown', function wake() { Sound.unlock(); document.removeEventListener('pointerdown', wake, true); }, true);
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented) return;
    if (!$('overlay').hidden) { if (e.key === 'Escape') closeOverlay(); return; }
    if (e.target && e.target.tagName === 'BUTTON') return;
    if (current !== 'tutorial' && e.key === 'ArrowLeft' && viewDay > 1) { goToDay(viewDay - 1); return; }
    if (current !== 'tutorial' && e.key === 'ArrowRight' && viewDay < TODAY) { goToDay(viewDay + 1); return; }
    if (pg().done) return;
    if (e.key === 'Backspace') { if (chain.length) { e.preventDefault(); removeFromChain(chain[chain.length - 1], true); } }
    else if (e.key === 'Escape') clearChain();
  });

  /* ---------- overlay cards ---------- */
  function openOverlay() { $('overlay').hidden = false; }
  function closeOverlay() { $('overlay').hidden = true; }
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeOverlay(); });

  function openHelp() {
    const c = $('card');
    c.innerHTML =
      '<button class="card-x" id="cardX" type="button" aria-label="Close">×</button>' +
      '<h2>How to play</h2>' +
      '<ol>' +
      '<li>Today\'s hidden words are cut into bubbles of 1 to 3 letters and scrambled.</li>' +
      '<li>Tap or swipe the bubbles that belong together, in order. They fly into the tray, and when they make a word they click into place.</li>' +
      '<li>Every word scores and nothing is ever taken away, so tap freely. More points earn more stars, up to 3, and a quick finish wins a bronze, silver or gold time medal. Hidden words in a row build a combo (up to ×4); putting a bubble back or using a hint starts it over.</li>' +
      '<li>Spelled a real word that isn\'t hidden? It\'s a <b>bonus word</b> and scores too. Find them early: once a hidden word uses its bubbles, they\'re gone.</li>' +
      '<li>Stuck? <b>Shuffle</b> re-deals the bubbles for free. "One bubble away" means you\'re a single swap from a word.</li>' +
      '</ol>' +
      '<div class="demo" aria-hidden="true"><span class="ball">RA</span><span class="arrow">→</span><span class="ball">IN</span><span class="arrow">→</span><span class="ball">BOW</span><span class="arrow">=</span><span class="slot solved">RAINBOW</span></div>' +
      '<p class="sub">Three boards a day: Easy, Medium and Hard. New words at midnight. Earlier days stay open from the calendar.</p>' +
      '<div class="actions"><button class="btn secondary" id="tutBtn" type="button">Replay tutorial</button><button class="btn primary" id="closeBtn" type="button">Got it</button></div>';
    $('tutBtn').addEventListener('click', () => { tutorialProgress = freshProgress(); closeOverlay(); switchTo('tutorial'); });
    $('closeBtn').addEventListener('click', closeOverlay);
    openOverlay();
  }

  function openDays() {
    const c = $('card');
    const st = store.stats;
    const stat = (n, label) => '<div class="stat"><b>' + n + '</b><span>' + label + '</span></div>';
    c.innerHTML =
      '<button class="card-x" id="cardX" type="button" aria-label="Close">×</button>' +
      '<h2>Your days</h2>' +
      '<div class="stats">' + stat(st.days, 'Days') + stat(st.streak, 'Streak') + stat(st.best, 'Best') + stat(st.perfect, '3★ days') + '</div>' +
      '<p class="countdown" id="cardCountdown"></p>' +
      '<div class="days" id="dayList"></div>' +
      '<div class="days-foot"><span class="sub">Only today counts toward your streak.</span></div>';
    startCountdown($('cardCountdown'));
    const list = $('dayList');
    for (let d = TODAY; d >= Math.max(1, TODAY - KEEP_DAYS); d--) {
      const row = document.createElement('div');
      row.className = 'dayrow' + (d === viewDay ? ' current' : '');
      const dn = document.createElement('span'); dn.className = 'dn'; dn.textContent = fmtDate(d);
      const dd = document.createElement('span'); dd.className = 'dd'; dd.textContent = relDay(d);
      const lv = document.createElement('span'); lv.className = 'lv';
      let open = 0;
      LEVELS.forEach(l => { const i = document.createElement('i'); const done = isDone(d, l); if (done) i.className = 'done ' + l; else open++; i.setAttribute('aria-label', META[l].label + (done ? ' done' : ' open')); lv.appendChild(i); });
      const b = btn(open ? 'Play' : 'Open', open ? 'primary' : 'secondary', () => { closeOverlay(); goToDay(d); });
      row.append(dn, dd, lv, b);
      list.appendChild(row);
    }
    openOverlay();
  }
  $('card').addEventListener('click', e => { if (e.target && e.target.id === 'cardX') closeOverlay(); });
  $('helpBtn').addEventListener('click', openHelp);
  $('daysBtn').addEventListener('click', openDays);

  /* ---------- keep the honeycomb fitted to the screen ---------- */
  const relayout = () => { if (!$('play').hidden) { fitBoardHeight(); layoutBoard(); } };
  if (window.ResizeObserver) { try { new ResizeObserver(relayout).observe(board); } catch (e) { /* ignore */ } }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', () => setTimeout(relayout, 60));

  /* ---------- new day while open ---------- */
  setInterval(() => { if (previewDayNum == null && WB.todayNumber() !== TODAY) location.reload(); }, 60000);

  /* ---------- boot (keeps state across live updates of the page) ---------- */
  function start(hot) {
    if (hot && typeof hot.viewDay === 'number' && hot.viewDay >= 1) viewDay = hot.viewDay;
    if (hot && typeof hot.current === 'string' && (hot.current === 'tutorial' || LEVELS.indexOf(hot.current) >= 0)) current = hot.current;
    if (hot && Array.isArray(hot.chain)) chain = hot.chain.filter(id => bubbleById(id) && pg().consumed.indexOf(id) < 0);
    render();
  }
  const hot = (window.claude && window.claude.hot) || null;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ viewDay: viewDay, current: current, chain: chain })); } catch (e) { /* ignore */ }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>

</body></html>
