role: "Account Executive, Cross Border, Greater China"
headline: "Builder-Operator with International Revenue Track Record — Cross-Border Commercial Depth"
summary: >
  Founder-engineer with an international revenue track record and complex cross-border
  deal structuring experience. Drove $5M+ in apparel pre-order GMV at Faire across
  three international markets — owned the full commercial lifecycle from technical
  discovery through staged international rollout. Brokered AXED's IP rights deal
  with Wattpad WEBTOON Studios for a multi-year, multi-format adaptation (book +
  2-season animated television releasing 2025). Now building CentrOS, a production
  AI agent orchestration platform whose first deployment handles cross-border vendor
  invoices and compliance workflows. Brings deep technical fluency to cross-border
  conversations with API-first technology buyers — the credibility most cross-border
  AEs lack.
