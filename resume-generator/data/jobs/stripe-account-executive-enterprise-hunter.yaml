slug: stripe-account-executive-enterprise-hunter
company: Stripe
role: Account Executive, Enterprise
headline: "Engineer-Founder · API-Product Fluency · Enterprise Value Selling"
summary: >
  Engineer-founder who has spent a decade shipping API-first products and now leads
  sales for CentrOS, a production AI orchestration platform. Drove $5M+ apparel
  pre-order GMV at Faire across three international markets — owned cross-functional
  execution, account planning, and complex negotiations across product, engineering,
  and finance. Brokered AXED's IP rights deal with Wattpad WEBTOON Studios for a
  multi-year book + 2-season animated television adaptation (2025). Where I uniquely
  help Stripe Enterprise: leading deeply technical sales conversations with C-level
  CTO/CFO buyers, running product workshops, building value proposition and
  financial analysis, and partnering with Solutions Architects on consultative deal
  cycles where the technical product is the deal.

